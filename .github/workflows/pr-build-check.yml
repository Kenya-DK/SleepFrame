name: PR Build Check

on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build-check:
    name: Build Check (windows)
    # SleepFrame is Windows-only (uses Win32 APIs), so we build on Windows.
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npx tauri build --debug --no-bundle
        env:
          TAURI_SKIP_SIGNING: "true"
