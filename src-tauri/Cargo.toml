[package]
name = "sleepframe"
version = "1.0.0"
description = "SleepFrame - Warframe macro tool"
authors = ["SleepFrame"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sleepframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6"
regex = "1"
base64 = "0.22"
ocrs = "0.13"
rten = "0.26"
xcap = "0.9"
image = { version = "0.25", default-features = false }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

# `ocrs`/`rten` are extremely slow unless compiled with optimizations, even in
# debug builds (see the ocrs README). Optimize just those crates so OCR stays
# fast while running `tauri dev`.
[profile.dev.package.ocrs]
opt-level = 3

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package.rten-base]
opt-level = 3

[profile.dev.package.rten-gemm]
opt-level = 3

[profile.dev.package.rten-imageproc]
opt-level = 3

[profile.dev.package.rten-model-file]
opt-level = 3

[profile.dev.package.rten-onnx]
opt-level = 3

[profile.dev.package.rten-parallel]
opt-level = 3

[profile.dev.package.rten-shape-inference]
opt-level = 3

[profile.dev.package.rten-simd]
opt-level = 3

[profile.dev.package.rten-tensor]
opt-level = 3

[profile.dev.package.rten-vecmath]
opt-level = 3

[profile.dev.package.rayon]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
